# Research-only branch preflight; not for upstream submission.
name: Ukraine Treasury fiscal research
on:
  push:
    branches: [research/ukraine-treasury-fiscal]
    paths:
      - "research/ukraine-fiscal/**"
      - ".github/workflows/ukraine-treasury-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-parser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source syntax
        run: python -m compileall -q research/ukraine-fiscal
      - name: Validate Treasury source and definitions
        run: python -m unittest discover -s research/ukraine-fiscal/tests -p 'test_*.py' -v
  live-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Stage live official NBU Treasury cash budget extract (candidate only)
        run: python research/ukraine-fiscal/probe_treasury_functional.py
      - name: Report staged 2014–2025 candidate without publishing it
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path("research/ukraine-fiscal/cache/treasury_functional_candidate.csv")
          with path.open(encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==12*11, len(rows)
          years={r["year"] for r in rows}
          assert years=={str(y) for y in range(2014,2026)}, sorted(years)
          print("Verified 132 candidate annual CBU functional records, source-only.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: treasury-fiscal-research-candidate
          path: research/ukraine-fiscal/cache/treasury_functional_candidate.csv
          retention-days: 7
