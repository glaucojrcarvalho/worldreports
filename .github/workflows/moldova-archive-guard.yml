name: Moldova archive guard fork-only tests
on:
  push:
    branches: [research/moldova-archive-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'glaucojrcarvalho/worldreports'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-neutral archive replay rules without pushing
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q countries/moldova/research/archive_branch_guard.py tests/test_moldova_archive_branch_guard.py
          python -m pytest -q tests/test_moldova_archive_branch_guard.py tests/test_moldova_archive_contract.py
      - name: Require unregistered focused fork branch
        run: |
          test "$GITHUB_REPOSITORY" = "glaucojrcarvalho/worldreports"
          test ! -f countries/moldova/country.yaml
