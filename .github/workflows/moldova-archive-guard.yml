name: Moldova archive guard fork-only tests
on:
  push:
    branches: [research/moldova-archive-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'glaucojrcarvalho/worldreports'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-neutral archive replay rules without pushing
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q countries/moldova/research/archive_branch_guard.py tests/test_moldova_archive_branch_guard.py
          python -m pytest -q tests/test_moldova_archive_branch_guard.py tests/test_moldova_archive_contract.py
      - name: Attest exact registered research inputs without publishing
        run: |
          python -m pytest -q tests/test_moldova_rehearsal_parity.py
          git fetch --no-tags origin \
            +refs/heads/research/moldova-source-audit:refs/remotes/origin/research/moldova-source-audit \
            +refs/heads/research/moldova-release-rehearsal:refs/remotes/origin/research/moldova-release-rehearsal
          python -m countries.moldova.research.verify_rehearsal_parity
      - name: Preserve git SHA content-parity report
        uses: actions/upload-artifact@v4
        with:
          name: moldova-rehearsal-content-parity
          path: /tmp/moldova-parity.json
          retention-days: 14
          if-no-files-found: error
      - name: Audit all canonical spine slots and preserve pending-source decisions
        run: |
          python -m pytest -q tests/test_moldova_semantic_readiness.py
          python -m countries.moldova.research.audit_semantic_readiness
          cat /tmp/moldova-semantic-readiness.json
      - name: Upload source-backed release-readiness matrix (not publication)
        uses: actions/upload-artifact@v4
        with:
          name: moldova-semantic-readiness-inventory
          path: /tmp/moldova-semantic-readiness.json
          if-no-files-found: error
          retention-days: 14
      - name: Rebuild exact Moldova site and audit three-language asset routes
        run: |
          test "$GITHUB_REPOSITORY" = "glaucojrcarvalho/worldreports"
          python -m pytest -q tests/test_moldova_site_routes.py
          cp countries/moldova/research/country_candidate.yaml countries/moldova/country.yaml
          python -m core.render moldova
          python -m core.thumbs moldova
          python -m core.page --out /tmp/moldova-site-review moldova
          python -m countries.moldova.research.site_route_audit \
            --site /tmp/moldova-site-review/moldova \
            --output countries/moldova/output
          rm countries/moldova/country.yaml
          test ! -f countries/moldova/country.yaml
      - name: Block premature Dataset JSON-LD publication claims
        run: |
          python -m pytest -q tests/test_moldova_prerelease_metadata.py
          python -m countries.moldova.research.audit_prerelease_metadata \
            --site /tmp/moldova-site-review/moldova
          cat /tmp/moldova-publication-blockers.json
      - name: Retain exact prerelease metadata decision, no deploy
        uses: actions/upload-artifact@v4
        with:
          name: moldova-publication-blockers
          path: /tmp/moldova-publication-blockers.json
          retention-days: 14
          if-no-files-found: error

