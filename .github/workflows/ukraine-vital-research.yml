# Disposable fork-only discovery harness.
# Delete before any upstream PR; never included in generated site.
name: Ukraine vital records research
on:
  push:
    branches:
      - feat/ukraine-demography-followup
    paths:
      - "countries/ukraine/fetch/probe_vital_sdmx.py"
      - "countries/ukraine/fetch/fetch_vital_sdmx.py"
      - "countries/ukraine/data/demography/vital_ukrstat.csv"
      - "countries/ukraine/tests/test_vital_source.py"
      - "countries/ukraine/plates.py"
      - "countries/ukraine/chapters.py"
      - "countries/ukraine/i18n.json"
      - "countries/ukraine/ui.json"
      - "countries/ukraine/SOURCES.yaml"
      - "countries/ukraine/DATA_NOTES.md"
      - ".github/workflows/ukraine-vital-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install chart rendering requirements and Ukrainian fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-liberation fonts-noto-core
          python -m pip install -r requirements.txt
      - name: Regenerate Ukraine's four plates in all three languages
        run: |
          make C=ukraine charts thumbs provenance
          make site
      - name: Source, spine and translation regressions
        run: |
          python -m unittest discover -s countries/ukraine/tests -p test_vital_source.py -v
          python -m pytest -q tests/test_spine.py -k ukraine
          git diff --check
      - name: Run fast repository-wide Python and JavaScript gates
        run: make test-fast
      - name: Commit only regenerated Ukrainian demography and provenance to the fork
        if: github.ref == 'refs/heads/feat/ukraine-demography-followup'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- countries/ukraine/output/03-demography.png countries/ukraine/output/03-demography.svg
          git add -- countries/ukraine/output/03-demography.uk.png countries/ukraine/output/03-demography.uk.svg
          git add -- countries/ukraine/output/03-demography.pt.png countries/ukraine/output/03-demography.pt.svg
          git add -- countries/ukraine/output/thumbs/03-demography.png countries/ukraine/output/thumbs/03-demography.uk.png countries/ukraine/output/thumbs/03-demography.pt.png
          git add -- countries/ukraine/provenance.json
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "build(ukraine): regenerate trilingual demography plates, thumbs and provenance"
            git push origin HEAD:feat/ukraine-demography-followup
          fi
      - name: Save render review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukraine-vital-render-review
          path: |
            countries/ukraine/output/
            countries/ukraine/provenance.json
            _site/ukraine/
          if-no-files-found: warn
          retention-days: 10

  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax gate
        run: python -m compileall -q countries/ukraine/fetch/probe_vital_sdmx.py
      - name: Offline demographic invariants
        run: python -m unittest discover -s countries/ukraine/tests -p test_vital_source.py -v
      - name: Rebuild official Ukrstat annual vital records into review sidecar
        run: |
          python countries/ukraine/fetch/fetch_vital_sdmx.py
          diff -u countries/ukraine/data/demography/vital_ukrstat.csv countries/ukraine/data/demography/vital_ukrstat_from_sssu.csv
      - name: Check official Ukrstat vital series (read only)
        run: python countries/ukraine/fetch/probe_vital_sdmx.py --live
      - name: Preserve official responses, audit and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukraine-vital-sdmx-review
          path: countries/ukraine/cache/demography_vital/
          if-no-files-found: warn
          retention-days: 10
