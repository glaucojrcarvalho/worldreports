# Validated full peer-image archive, FORK RESEARCH BRANCH ONLY.
# Changes only published peer trade/world PNG/SVG/thumbs after strict
# whole-atlas source/site/browser tests and bounded pixel QA. No deployment,
# country.yaml registration, upstream push, merge, or upstream PR.
name: Moldova peer-axis assets research archive

on:
  push:
    branches: [research/moldova-source-audit]
    paths: [.github/workflows/moldova-peer-archive.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-asset-archive:
    if: >-
      github.repository == 'glaucojrcarvalho/worldreports' &&
      github.ref == 'refs/heads/research/moldova-source-audit'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication fonts before any Python rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          find "${HOME}/.cache/matplotlib" -maxdepth 1 -name 'fontlist-*.json' -delete 2>/dev/null || true
      - name: Install renderer/test dependencies
        run: pip install -r requirements.txt
      - name: Validate shared scales, peers, and the read-only guard
        run: python -m pytest -q tests/test_moldova_peer_scale_gate.py
      - name: Rebuild and stage only world/trade peer images in disposable runner
        run: |
          python -m countries.moldova.research.peer_scale_gate \
            --out /tmp/moldova-peer-asset-review --stage-for-site
      - name: Assert full peer/image coverage, pixel stability and EXACT staged paths
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from PIL import Image
          report = json.loads(Path('/tmp/moldova-peer-asset-review/peer-scale-report.json').read_text())
          assert report['staged_in_ephemeral_runner'] is True
          assert len(report['published_peers']) == 25
          assert report['render_count'] == 138
          assert report['changed_decoded_images'] == 138
          assert not Path('countries/moldova/country.yaml').exists()
          expected = set()
          for row in report['observations']:
              assert row['country'] in report['published_peers']
              assert row['topic'] in ('world', 'trade')
              assert 0 < row['pixel_change_percent'] <= 12, row
              assert all(abs(x) <= 2 for x in row['dimension_drift_px']), row
              assert row['old_sha256'] != row['new_sha256'], row
              p = Path('countries') / row['country'] / 'output'
              png = row['asset']
              assert Path(png).suffix == '.png'
              for path in (p / png, p / (Path(png).stem + '.svg'),
                           p / 'thumbs' / png):
                  assert path.is_file(), path
                  expected.add(path.as_posix())
          modified = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '--', 'countries'], text=True).splitlines())
          assert len(expected) == 414, (len(expected), expected)
          assert modified == expected, {
              'missing': sorted(expected - modified)[:30],
              'unexpected': sorted(modified - expected)[:30]}
          for topic in ('trade', 'world'):
              with Image.open('/tmp/moldova-peer-asset-review/before-after-' + topic + '.png') as image:
                  image.verify()
          # Guard ALL source and metadata files from accidental staged edits.
          all_changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True).splitlines())
          assert all_changed == expected
          Path('/tmp/moldova-peer-asset-review/approved-paths.txt').write_text(
              '\n'.join(sorted(expected)) + '\n', encoding='utf-8')
          print('Approved exact 414 PNG/SVG/thumb paths for 138 shared-axis peer plates.')
          PY
      - name: Validate full site, sources, catalogs and browser JS after staging
        run: |
          python -m core.page --out /tmp/moldova-peer-asset-site
          python -m pytest -q tests/test_sources.py tests/test_catalogs.py
          node --test tests/js/*.test.js
      - name: Preserve peer contact sheets, source-neutral pixel reports and 414 file inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moldova-peer-asset-archive-audit
          path: /tmp/moldova-peer-asset-review/
          retention-days: 14
      - name: Commit exactly validated peer binaries into fork research branch only
        run: |
          # The whole workflow has been guarded by fork/research branch identity.
          # Recheck before git write and do NOT force/rewrite existing history.
          test "${GITHUB_REPOSITORY}" = "glaucojrcarvalho/worldreports"
          test "${GITHUB_REF}" = "refs/heads/research/moldova-source-audit"
          test ! -e countries/moldova/country.yaml
          test -s /tmp/moldova-peer-asset-review/approved-paths.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/moldova-peer-asset-review/approved-paths.txt
          git diff --cached --quiet && { echo "::error::No peer assets changed"; exit 1; }
          git commit -m 'build(moldova): archive 138 reviewed peer shared-axis plates in research fork'
          git fetch origin research/moldova-source-audit
          latest="$(git rev-parse origin/research/moldova-source-audit)"
          if test "${latest}" != "${GITHUB_SHA}"; then
            # No source or published-peer change may have occurred since
            # the runner rendered its images; Moldova-only commits may rebase.
            git diff --name-only "${GITHUB_SHA}" origin/research/moldova-source-audit \
              | python -c 'import sys; p=sys.stdin.read().splitlines(); bad=[x for x in p if x.startswith("core/") or x.startswith("site/") or x.startswith("countries/") and not x.startswith("countries/moldova/") or x in ("requirements.txt","pyproject.toml")]; print("New peer-source changes:",bad); sys.exit(bool(bad))'
            git rebase origin/research/moldova-source-audit
          fi
          git push origin HEAD:refs/heads/research/moldova-source-audit
