# Live UNDP publisher audit; never commits a source value automatically.
name: Moldova UNDP HDR 2025 HDI source audit

on:
  push:
    branches:
      - research/moldova-source-audit
    paths:
      - countries/moldova/fetch/fetch_undp.py
      - tests/test_moldova_undp.py
      - .github/workflows/moldova-undp-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-undp-source:
    if: github.repository == 'glaucojrcarvalho/worldreports'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test vintage, isolated country, payload and semantics offline
        run: python -m pytest -q tests/test_moldova_undp.py
      - name: Fetch and verify the actual official HDR 2025 CSV
        run: python countries/moldova/fetch/fetch_undp.py
      - name: Archive only the review sidecar (not the atlas CSV)
        uses: actions/upload-artifact@v4
        with:
          name: moldova-undp-2025-hdi-source-review
          path: countries/moldova/data/world/hdi_from_undp.csv
          if-no-files-found: error
          retention-days: 14
