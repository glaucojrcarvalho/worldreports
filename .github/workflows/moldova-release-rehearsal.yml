# Isolated fork-only registration rehearsal. Read-only. No deployment.
name: Moldova atlas isolated release rehearsal
on:
  push:
    branches: [research/moldova-release-rehearsal]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas-rehearsal:
    if: github.repository == 'glaucojrcarvalho/worldreports'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and publication fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install -r requirements.txt
      - name: Guard exact candidate and fork-only branch
        run: |
          test "$GITHUB_REPOSITORY" = "glaucojrcarvalho/worldreports"
          test "$GITHUB_REF" = "refs/heads/research/moldova-release-rehearsal"
          cmp countries/moldova/country.yaml countries/moldova/research/country_candidate.yaml
          python -m pytest -q tests/test_moldova_country_candidate.py
      - name: Build full trilingual figures, thumbnails, source provenance
        run: |
          python -m core.render moldova
          python -m core.thumbs moldova
          python -m core.provenance moldova
          python countries/moldova/research/audit_candidate_assets.py
          python countries/moldova/research/visual_review.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("countries/moldova")
          refs = json.loads((root / "provenance.json").read_text())
          assert len(refs) == 12
          expected = {
              "01-economy": ["macro/economy.csv", "macro/national_lfs.csv", "world/world.csv"],
              "03-spending": ["fiscal/nominal_gdp_bns.csv", "fiscal/public_budget.csv", "macro/economy.csv"],
              "12-migration": ["demography/demography.csv", "migration/foreign_born_census.csv", "migration/migration.csv"],
          }
          for plate, files in expected.items():
              assert refs[plate] == files, (plate, refs[plate])
          assert len(list((root / "output").glob("*.png"))) == 36
          assert len(list((root / "output").glob("*.svg"))) == 36
          assert len(list((root / "output/thumbs").glob("*.png"))) == 36
          print("Rehearsal: 108 figures and 12 provenance records validated")
          PY
      - name: Build all countries' site and check Moldovan language routes
        run: |
          python -m core.page --out /tmp/moldova-release-site
          python - <<'PY'
          from pathlib import Path
          for lang in ("ro", "en", "pt"):
              page = Path("/tmp/moldova-release-site/moldova") / lang / "index.html"
              assert page.is_file(), page
          print("All country pages built; Moldova ro/en/pt exists")
          PY
      - name: Run full Python atlas regression
        run: python -m pytest -q
      - name: Run browser JavaScript regression
        run: node --test tests/js/*.test.js
      - name: Preserve evidence, no deploy or push
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moldova-release-rehearsal
          path: |
            countries/moldova/output/
            countries/moldova/provenance.json
            /tmp/moldova-release-site/moldova/
            /tmp/moldova-visual-review/
          if-no-files-found: warn
          retention-days: 14
