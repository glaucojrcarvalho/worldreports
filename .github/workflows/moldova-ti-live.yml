# Official TI publisher-only audit; read-only and never edits curated data.
name: Moldova TI CPI 2025 publisher audit

on:
  push:
    branches:
      - research/moldova-source-audit
    paths:
      - countries/moldova/fetch/fetch_ti.py
      - tests/test_moldova_ti.py
      - .github/workflows/moldova-ti-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ti-cpi-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source parser with offline OOXML fixtures
        run: |
          python -m pip install 'pytest~=9.0'
          python -m pytest -q tests/test_moldova_ti.py
      - name: Download and audit TI 2025 official historical workbook
        run: |
          python countries/moldova/fetch/fetch_ti.py --out countries/moldova/data/world/cpi_from_ti.csv
          test -s countries/moldova/data/world/cpi_from_ti.csv
          test "$(grep -c '^[0-9][0-9][0-9][0-9],' countries/moldova/data/world/cpi_from_ti.csv)" -eq 14
      - name: Archive review-only CPI source observations
        uses: actions/upload-artifact@v4
        with:
          name: moldova-ti-2025-cpi-source-review
          path: countries/moldova/data/world/cpi_from_ti.csv
          retention-days: 14
