# Branch-only offline validation. Does not build or deploy GitHub Pages.
name: Moldova research quality gate

on:
  push:
    branches:
      - research/moldova-source-audit
    # The archive bot writes only artifacts previously verified by this
    # workflow; do not recursively run another 30-minute global test.
    paths-ignore:
      - 'countries/moldova/output/**'
      - 'countries/moldova/provenance.json'
  workflow_dispatch:

# Regression with 25+ published peers takes ~30 minutes. A newer research
# push must NOT cancel an already-running validated-source job: that caused
# repeated cancellations and prevented exact-source asset archival.
# GitHub's concurrency group retains at most one RUNNING and one PENDING
# run, replacing obsolete pending runs. Non-fast-forward archive pushes
# already refuse to overwrite images built from stale commits.
concurrency:
  group: moldova-research-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  moldova-research:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and source dependencies
        run: pip install -r requirements.txt
      # Earlier Matplotlib imports create a stale fontlist cache before
      # fonts-noto-cjk exists. Install/refresh BEFORE any render or pytest.
      - name: Install CJK publication fonts and invalidate stale Matplotlib cache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          find "${HOME}/.cache/matplotlib" -maxdepth 1 -name 'fontlist-*.json' -delete 2>/dev/null || true
          python - <<'PY'
          from core import style
          for lang in ('ja', 'ko', 'zh-Hans', 'zh-Hant'):
              assert style.has_script_font(lang), (
                  f'Missing renderable CJK font for {lang}: '
                  f'{sorted(style._available())}')
              print(lang, style.body_font(lang))
          PY

      - name: Validate Moldova source code and source tests, offline
        run: |
          python -m compileall -q countries/moldova/fetch countries/moldova/research tests/test_moldova_*.py
          python -m pytest -q tests/test_moldova_research.py tests/test_moldova_bns_budget.py tests/test_moldova_bns_gdp.py tests/test_moldova_bns_census_foreign_born.py tests/test_moldova_bns_trade.py tests/test_moldova_fiscal_data.py tests/test_moldova_fiscal_preview.py tests/test_moldova_nbm.py tests/test_moldova_imf.py tests/test_moldova_markets_preview.py tests/test_moldova_country_candidate.py tests/test_moldova_ro_numstyle.py tests/test_moldova_bns_poverty.py tests/test_moldova_minimum_wage.py tests/test_moldova_wdi_credit.py tests/test_moldova_nbm_npl.py tests/test_moldova_nbm_npl_fetch.py tests/test_moldova_undp.py tests/test_moldova_ti.py tests/test_moldova_archive_contract.py tests/test_moldova_visual_review.py tests/test_moldova_archive_branch_guard.py tests/test_moldova_site_routes.py tests/test_moldova_rehearsal_parity.py tests/test_moldova_semantic_readiness.py tests/test_moldova_mortality_unit.py tests/test_moldova_new_source_lanes.py
      - name: Audit official NBM new mortgage and government S13 P51 source candidates
        run: |
          python -m countries.moldova.research.audit_new_source_lanes
          cat /tmp/moldova-official-source-lanes.json
      - name: Preserve issuer source-vintage and incomplete annual-lane evidence
        uses: actions/upload-artifact@v4
        with:
          name: moldova-official-source-lanes
          path: /tmp/moldova-official-source-lanes.json
          retention-days: 14
          if-no-files-found: error
      - name: Run cross-country number formatting regression suite
        run: |
          python -m pytest -q tests/test_numbers.py
          python -m pytest -q tests/test_core.py -k "shared_code_names_no_country"
      - name: Render national budget research preview, not a published plate
        run: python countries/moldova/research/render_fiscal_preview.py
      - name: Render IMF WEO/FPP separate-vintage fiscal research preview
        run: python countries/moldova/research/render_imf_preview.py
      - name: Render market research previews in Romanian, English and Portuguese
        run: python countries/moldova/research/render_markets_preview.py
      - name: Store fiscal and trilingual market research figures for visual QA only
        uses: actions/upload-artifact@v4
        with:
          name: moldova-fiscal-research-previews
          path: |
            countries/moldova/research/output/moldova_fiscal_preview.png
            countries/moldova/research/output/moldova_imf_fiscal_preview.png
            countries/moldova/research/output/moldova_markets_preview.*.png
          retention-days: 14

      - name: Assert source-to-plate semantics and spine decisions
        run: python -m pytest -q tests/test_moldova_plate_design.py
      - name: Test draft English plates in an isolated CI-only country registration
        run: |
          cp countries/moldova/research/country_candidate.yaml countries/moldova/country.yaml
          python - <<'PY'
          import json
          from core.country import Country
          from core import sitebuild
          country = Country.load("moldova")
          cards = sitebuild.chapters_for(country)
          strip = sitebuild.headline_for(country)
          assert len(cards) == 12, len(cards)
          assert len(strip) >= 6, len(strip)
          assert [c["topic"] for c in cards] == [
              "economy", "fiscal", "spending", "trade", "markets", "credit",
              "people", "world", "demography", "security", "mortality", "migration"]
          assert [s["label"]["en"] for s in strip[:3]][0].startswith("GDP")
          assert strip[1]["label"]["en"].startswith("GDP per person")
          assert strip[2]["label"]["en"].startswith("Population")
          with open("countries/moldova/ui.json", encoding="utf-8") as f:
              u = json.load(f)
          with open("site/ui.json", encoding="utf-8") as f:
              shared = json.load(f)
          assert set(u) == {"ro","en","pt"}
          assert len(u["ro"]["unavailable"]) == len(u["en"]["unavailable"]) == len(u["pt"]["unavailable"]) == 7
          assert set(shared["ro"]) == set(shared["en"])
          print(f"Candidate card QA passed: {len(cards)} chapters / {len(strip)} headlines")
          PY
          python -m core.render moldova --langs en --out /tmp/moldova-phase-b
      - name: Require complete Romanian and Portuguese render translations (no fallback)
        run: |
          python -m core.render moldova --langs ro,pt --out /tmp/moldova-phase-b-translations
      - name: Build isolated trilingual candidate, thumbs and observed provenance (not deployed)
        run: |
          python -m core.render moldova
          # Inspect the actual generated SVG groups. This must run AFTER
          # rendering rather than in the early source-only test phase.
          python -m pytest -q tests/test_moldova_mortality_svg.py
          python -m core.thumbs moldova
          python -m core.provenance moldova
          python countries/moldova/research/audit_candidate_assets.py
          python countries/moldova/research/visual_review.py
          python -m core.page --out /tmp/moldova-candidate-site moldova
          python countries/moldova/research/site_route_audit.py --site /tmp/moldova-candidate-site/moldova --output countries/moldova/output
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from tests.test_layout import faults
          root = Path("countries/moldova")
          output = root / "output"
          actual = sorted(output.glob("*.png"))
          thumbs = sorted((output / "thumbs").glob("*.png"))
          assert len(actual) == 36, (len(actual), actual)
          assert len(thumbs) == 36, (len(thumbs), thumbs)
          provenance = json.loads((root / "provenance.json").read_text())
          assert len(provenance) == 12, provenance
          assert len(set(v for files in provenance.values() for v in files)) >= 8
          for locale in ("ro", "en", "pt"):
              page = Path("/tmp/moldova-candidate-site/moldova") / locale / "index.html"
              assert page.exists(), page
              assert "Moldova" in page.read_text(encoding="utf-8") or "Moldávia" in page.read_text(encoding="utf-8")
              issues = faults("moldova", locale)
              count = dict(Counter(item.split()[1] for item in issues))
              print(f"Layout audit {locale}: {count}")
              outside = [f for f in issues if "OUTSIDE" in f]
              if outside:
                  print("\\n".join(outside[:15]))
              assert not outside, f"{locale}: {len(outside)} labels outside canvas"
          print(f"Draft site QA: {len(actual)} plates, {len(thumbs)} thumbs, {len(provenance)} traced plate sources")
          PY
          python -m pytest -q tests/test_sources.py
          echo '=== MOLDOVA GENERATED PROVENANCE START ==='
          cat countries/moldova/provenance.json
          echo '=== MOLDOVA GENERATED PROVENANCE END ==='

      - name: Verify exact source-to-registered-rehearsal input and provenance parity
        run: |
          # Pin attestation to the exact commit that rendered/tested assets,
          # NOT the research branch tip (which an archive job may advance).
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            +refs/heads/research/moldova-release-rehearsal:refs/remotes/origin/research/moldova-release-rehearsal
          python -m countries.moldova.research.verify_rehearsal_parity --source HEAD
          cat /tmp/moldova-parity.json
      - name: Preserve SHA-pinned research/rehearsal equivalence report
        uses: actions/upload-artifact@v4
        with:
          name: moldova-rehearsal-content-parity
          path: /tmp/moldova-parity.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce canonical source gaps and archive semantic readiness matrix
        run: |
          python -m countries.moldova.research.audit_semantic_readiness
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/moldova-semantic-readiness.json").read_text("utf-8"))
          assert report["counts"] == {
              "claimed": 45, "canonical": 42, "observed": 36,
              "pending": 9, "optional_unclaimed_lenses": 3,
          }
          assert report["release_status"] == "research_only_pending_canonical_indicators"
          print("Semantic gaps retained; no fabricated values or automatic registration")
          PY
      - name: Preserve exact canonical-slot readiness evidence (not publication)
        uses: actions/upload-artifact@v4
        with:
          name: moldova-canonical-slot-readiness
          path: /tmp/moldova-semantic-readiness.json
          retention-days: 14
          if-no-files-found: error

      - name: Exercise full atlas and browser JS tests with isolated Moldova
        run: |
          # The candidate-only guard was already tested before its temporary
          # country.yaml copy; the rest must pass WITH Moldova in the registry.
          python -m pytest -q --ignore=tests/test_moldova_country_candidate.py
          node --test tests/js/*.test.js

      - name: Store trilingual contact sheets and exact rendered-asset hashes
        uses: actions/upload-artifact@v4
        with:
          name: moldova-visual-review
          path: /tmp/moldova-visual-review/
          if-no-files-found: error
          retention-days: 14

      # This artifact is created ONLY after the complete Python/Node gate.
      # The archive job must consume these exact checked bytes, not rerender.
      - name: Upload exact full-suite-validated Moldova assets for fork-only archive
        uses: actions/upload-artifact@v4
        with:
          name: moldova-validated-assets
          path: |
            countries/moldova/output/
            countries/moldova/provenance.json
          if-no-files-found: error
          retention-days: 5

      - name: Preserve draft PNGs and candidate site for visual QA (not deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moldova-phase-c-localized-draft
          path: |
            /tmp/moldova-phase-b/
            /tmp/moldova-phase-b-translations/
            countries/moldova/output/
            countries/moldova/provenance.json
            /tmp/moldova-candidate-site/moldova/
          retention-days: 5

  # No site deploy, no upstream write, no automatic registration. Preserve the
  # exact reviewed plates within this isolated research branch after QA passes.
  archive-validated-research-assets:
    needs: moldova-research
    if: >-
      github.repository == 'glaucojrcarvalho/worldreports' &&
      github.ref == 'refs/heads/research/moldova-source-audit' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download validated source-to-image artifacts from THIS workflow run
        uses: actions/download-artifact@v4
        with:
          name: moldova-validated-assets
          path: /tmp/moldova-validated-assets
      - name: Install offline verification dependencies
        run: pip install -r requirements.txt
      - name: Restore ONLY the exact fully tested assets and verify independently
        run: |
          test "${GITHUB_REPOSITORY}" = 'glaucojrcarvalho/worldreports'
          test "${GITHUB_REF}" = 'refs/heads/research/moldova-source-audit'
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          package = Path('/tmp/moldova-validated-assets')
          # upload-artifact removes the common countries/moldova prefix.
          # Explicitly fail if GitHub's artifact tree changes unexpectedly.
          expected = {'provenance.json', 'output'}
          assert {p.name for p in package.iterdir()} == expected
          assert (package / 'provenance.json').is_file()
          assert (package / 'output').is_dir()
          output = package / 'output'
          files = [p for p in output.rglob('*') if p.is_file()]
          assert len(files) == 108, len(files)  # 36 SVG, 36 PNG, 36 thumbs
          assert not any(p.is_symlink() for p in package.rglob('*'))
          target = Path('countries/moldova')
          shutil.rmtree(target / 'output')
          shutil.copytree(output, target / 'output')
          shutil.copyfile(package / 'provenance.json', target / 'provenance.json')
          for original in [package / 'provenance.json', *files]:
              copied = target / original.relative_to(package)
              assert hashlib.sha256(original.read_bytes()).digest() == (
                  hashlib.sha256(copied.read_bytes()).digest()
              ), original
          print('Archived candidate byte identity: 108 graphics and provenance')
          PY
          cp countries/moldova/research/country_candidate.yaml countries/moldova/country.yaml
          python countries/moldova/research/audit_candidate_assets.py
          rm countries/moldova/country.yaml
          test ! -e countries/moldova/country.yaml
      - name: Commit only isolated research PNGs and source provenance
        run: |
          git add -- countries/moldova/output countries/moldova/provenance.json
          if git diff --cached --quiet; then
            echo 'No changes to validated Moldova assets.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build(moldova): archive validated trilingual research plates'
          # A rejected non-fast-forward is NOT success: the images were
          # verified locally but were NOT archived on the research branch.
          # Never force, rewrite history, or claim this gate is green.
          git fetch origin research/moldova-source-audit
          newest="$(git rev-parse origin/research/moldova-source-audit)"
          if test "$newest" != "$GITHUB_SHA"; then
            git merge-base --is-ancestor "$GITHUB_SHA" "$newest" || {
              echo "::error::Run SHA is no longer an ancestor of the research branch."
              exit 1
            }
            git diff --name-only "$GITHUB_SHA" "$newest" \
              | python countries/moldova/research/archive_branch_guard.py
            git rebase "$newest"
          fi
          git push origin HEAD:refs/heads/research/moldova-source-audit
