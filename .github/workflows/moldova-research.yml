# Branch-only offline validation. Does not build or deploy GitHub Pages.
name: Moldova research quality gate

on:
  push:
    branches:
      - research/moldova-source-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moldova-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and source dependencies
        run: pip install -r requirements.txt
      - name: Validate Moldova source code and source tests, offline
        run: |
          python -m compileall -q countries/moldova/fetch countries/moldova/research tests/test_moldova_*.py
          python -m pytest -q tests/test_moldova_research.py tests/test_moldova_bns_budget.py tests/test_moldova_fiscal_data.py tests/test_moldova_fiscal_preview.py tests/test_moldova_nbm.py tests/test_moldova_imf.py tests/test_moldova_markets_preview.py tests/test_moldova_country_candidate.py tests/test_moldova_ro_numstyle.py
      - name: Run cross-country number formatting regression suite
        run: |
          python -m pytest -q tests/test_numbers.py
          python -m pytest -q tests/test_core.py -k "shared_code_names_no_country"
      - name: Render national budget research preview, not a published plate
        run: python countries/moldova/research/render_fiscal_preview.py
      - name: Render IMF WEO/FPP separate-vintage fiscal research preview
        run: python countries/moldova/research/render_imf_preview.py
      - name: Render market research previews in Romanian, English and Portuguese
        run: python countries/moldova/research/render_markets_preview.py
      - name: Store fiscal and trilingual market research figures for visual QA only
        uses: actions/upload-artifact@v4
        with:
          name: moldova-fiscal-research-previews
          path: |
            countries/moldova/research/output/moldova_fiscal_preview.png
            countries/moldova/research/output/moldova_imf_fiscal_preview.png
            countries/moldova/research/output/moldova_markets_preview.*.png
          retention-days: 14

      - name: Assert source-to-plate semantics and spine decisions
        run: python -m pytest -q tests/test_moldova_plate_design.py
      - name: Test draft English plates in an isolated CI-only country registration
        run: |
          cp countries/moldova/research/country_candidate.yaml countries/moldova/country.yaml
          python -m core.render moldova --langs en --out /tmp/moldova-phase-b
      - name: Preserve draft PNGs for offline visual review (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: moldova-phase-b-english-draft
          path: /tmp/moldova-phase-b/
          retention-days: 5
