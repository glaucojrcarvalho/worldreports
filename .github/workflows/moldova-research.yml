# Branch-only offline validation. Does not build or deploy GitHub Pages.
name: Moldova research quality gate

on:
  push:
    branches:
      - research/moldova-source-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moldova-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and source dependencies
        run: pip install -r requirements.txt
      - name: Validate Moldova source code and source tests, offline
        run: |
          python -m compileall -q countries/moldova/fetch tests/test_moldova_research.py tests/test_moldova_bns_budget.py
          python -m pytest -q tests/test_moldova_research.py tests/test_moldova_bns_budget.py
