# Data provenance — every series Ukraine publishes.
#
# Research pass 2026-10-24 (DISCOVERY.md is the record), curated 2026-10-24.
# Each entry below names a curated CSV under data/, written by reviewing
# the sidecar a fetch/*.py pulled; re-running a fetcher writes the
# `*_from_*` sidecar again, never a curated file. Every endpoint was
# probed live from the discovery network and its failure mode recorded
# under meta.pending when it did not answer.
#
# Territorial scope is per-series and repeated in each note. "Excl. TOT"
# means excluding the temporarily occupied territories (Crimea and
# Sevastopol from 2014, the occupied parts of Donetsk, Luhansk, Kherson
# and Zaporizhzhia oblasts from 2022); post-2014 Ukrstat series exclude
# them, World Bank and UN population series include Crimea throughout.
# The two are never mixed in one line.

macro:
  economy.csv:
    source: "World Bank WDI — NY.GDP.MKTP.KD.ZG (growth), FP.CPI.TOTL.ZG (CPI), NE.GDI.FTOT.ZS (GFCF), SL.UEM.TOTL.ZS (unemployment, ILO modelled)"
    url: "https://api.worldbank.org/v2/country/UKR/indicator/NY.GDP.MKTP.KD.ZG?format=json"
    official: false
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      VERIFIED 2026-10-24, current vintage: 2006-2025 observed. Growth
      2022 = -28.8 (the invasion year), 2023 = +5.5; CPI 2015 = 48.7
      (the hryvnia collapse). The CPI and unemployment lines are the
      World Bank's republication of Ukrstat's own indices — the
      national line joins them when the SSSU API answers (meta.pending).
      Unemployment is ILO-modelled: it covers the war years when the
      LFS itself was suspended, and is labelled as modelled on the plate.
  gdp_growth_imf.csv:
    source: "IMF DataMapper (WEO, current vintage) — NGDP_RPCH"
    url: "https://www.imf.org/external/datamapper/api/v1/NGDP_RPCH"
    official: false
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      VERIFIED 2026-10-24: the independent agreement line for the World
      Bank growth series — 2022 = -28.8 on both. WEO staff projections
      live only in gdp_growth_pct_proj, so observed and projected years
      never share a column.
  gdp_uah.csv:
    source: "World Bank WDI — NY.GDP.MKTP.CN (current-price GDP in hryvnia)"
    url: "https://api.worldbank.org/v2/country/UKR/indicator/NY.GDP.MKTP.CN?format=json"
    official: false
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      Cross-check only, not drawn: 2024 = 7,662,376 mn UAH, byte-
      identical to the figure Ukrstat publishes, which is the evidence
      that the dollar series and the national accounts describe the
      same economy.

world:
  gdp_usd.csv:
    source: "World Bank WDI — NY.GDP.MKTP.CD"
    url: "https://api.worldbank.org/v2/country/UKR/indicator/NY.GDP.MKTP.CD?format=json"
    official: false
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      VERIFIED 2026-10-24, current US$. The 2022 fall to US$161bn and
      the 2023-25 recovery are nominal; the real story is on the growth
      panel and the two are never mixed.
  gdp_per_person.csv:
    source: "World Bank WDI — NY.GDP.PCAP.CD"
    url: "https://api.worldbank.org/v2/country/UKR/indicator/NY.GDP.PCAP.CD?format=json"
    official: false
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      VERIFIED 2026-10-24. The 2022 drop is population-covered (the UN
      series includes refugees abroad), so this is GDP per resident, not
      per person present — said on the plate.
  reserves.csv:
    source: "World Bank WDI — FI.RES.TOTL.CD"
    url: "https://api.worldbank.org/v2/country/UKR/indicator/FI.RES.TOTL.CD?format=json"
    official: false
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      VERIFIED 2026-10-24, year-end, current US$. The wartime build-up
      to the 2024-25 peak is the NBU's reserves as the World Bank
      records them; the NBU's own monthly line is a fetch away
      (meta.pending).
  hdi.csv:
    source: "UNDP Human Development Report 2025 — HDI time series"
    url: "https://hdr.undp.org/data-center/documentation-and-downloads"
    official: true
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      VERIFIED 2026-10-24, one vintage (HDR 2025) throughout — the HDR
      recomputes the whole back-series, so a mixed vintage would be a
      splice. Covers 2006-2023; 2024-25 are not yet published.

people:
  gini.csv:
    source: "World Bank WDI — SI.POV.GINI"
    url: "https://api.worldbank.org/v2/country/UKR/indicator/SI.POV.GINI?format=json"
    official: false
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      VERIFIED 2026-10-24: 2006-2020, the household survey's Gini as the
      World Bank records it. The survey stopped with the invasion; the
      SDG portal's own Gini file (10-1-1.csv) carries 2015-2021 and
      blanks from 2022 — both are recorded, neither is spliced.

demography:
  population.csv:
    source: "World Bank WDI — SP.POP.TOTL (UN World Population Prospects)"
    url: "https://api.worldbank.org/v2/country/UKR/indicator/SP.POP.TOTL?format=json"
    official: false
    refreshed_by: fetch/fetch_comparables.py
    notes: >-
      VERIFIED 2026-10-24, mid-year de-facto total. TERRITORIAL
      CONVENTION: INCLUDES Crimea and Sevastopol throughout (2021 =
      44,298,640; 2022 = 41,048,766). This is the harmonised comparable
      line, never the national register; the two are drawn as separate
      labelled lines.
  population_ukrstat.csv:
    source: "State Statistics Service of Ukraine (SSSU), SDMX dataflow DF_POPULATION_STRUCTURE(8.0.0) — indicator PNMI_01, national, all ages, both sexes"
    url: "https://stat.gov.ua/sdmx/workspaces/default:integration/registry/sdmx/2.1/dataflow/SSSU/DF_POPULATION_STRUCTURE/8.0.0"
    official: true
    refreshed_by: fetch/fetch_ukrstat.py
    notes: >-
      VERIFIED 2026-10-24 against two known values (1989 = 51,706,700;
      2021 = 41,588,354), 34 annual observations. The publisher's own
      note: the 1 January register from 2015 EXCLUDES the temporarily
      occupied territories — the 45.4m -> 42.9m step between 2014 and
      2015 is that perimeter change, not a demographic event, and is
      annotated on the plate. stat.gov.ua answers HTTP 403 to this
      network; the dataflow payload was retrieved once and the fetcher
      reads that cache offline (meta.pending records the block).
fiscal:
  treasury_functional.csv:
    source: "State Treasury Service of Ukraine, consolidated cash-budget execution, functional classification; NBU statistical API republication"
    url: "https://bank.gov.ua/NBUStatService/v1/statdirectory/budget?json"
    official: true
    refreshed_by: fetch/fetch_treasury.py
    notes: >-
      CURATED 2026-10-24 from 21,182 NBU records, using the unique annual
      rows freq=Y, mcr200p=CBU, tzep=F_M_VC, indicator gf_budgtef_0100
      through gf_budgtef_1000 and total gf_budgtef_Total_1.
      2011-2025, 10 original Ukrainian functional groups and reported
      total. Unit: nominal MILLION UAH, consolidated Treasury CASH-budget
      execution, national administrative coverage, NOT IMF/SNA accrual
      general-government expenditure, COFOG, primary balance or debt.
      NBU dt=YYYY0101 references the PRECEDING calendar year, so
      20240101 = expenditure in 2023; 20250101 = expenditure in 2024.
      Independent source-year and value anchors: Ministry of Finance,
      Budget of Ukraine 2024, table 2.3 pages 34-37: 2023 defence
      2,097,621.9 and total 4,441,364.6; 2024 defence 2,305,242.7
      and total 4,945,680.7, all million UAH. The ten functions
      reconcile to their same-year functional total within 0.3 million
      UAH rounding throughout. Economic-classification total
      gf_budgtee_Total is DIFFERENT, excluded rather than spliced.
      An additional 2025 defence cross-check on the official Open Budget
      consolidated-budget portal (December 2025) is
      3,069,857,418,255.98 UAH, agreeing with the NBU to 0.1 million.
      Its visible overall total is 5,999,467.1 million UAH, however,
      versus 6,006,387.3 million in NBU functional Total_1; this
      publisher/vintage/category discrepancy remains UNRESOLVED,
      and the public portal total is not substituted into the series.
      The 2011-2025 series is not mapped to the seven comparative
      spending groups: national administrative classification,
      territorial and wartime coverage are not asserted to be
      perfectly comparable. Not yet drawn in canonical fiscal/spending
      slots pending a defensible complementary national presentation.
    independent_check: "https://mof.gov.ua/storage/files/Badgef%20of%20Ukraine2024.pdf"

meta:
  pending:
    - name: Ukrstat SDMX REST API and all stat.gov.ua publications
      publisher: State Statistics Service of Ukraine (SSSU)
      url: https://stat.gov.ua/en/development-api
      official: true
      notes: >-
        Every route on stat.gov.ua — /, /en/development-api, the SDMX
        registry path quoted from the publisher's own documentation
        (/sdmx/workspaces/default:integration/registry/sdmx/2.1/...) —
        answered HTTP 403 "The request is blocked" (WAF block page with
        a reference ID) on 2026-10-24, both schemes, browser UA
        included; www.ukrstat.gov.ua did not answer at all and no
        api./sdmx. subdomains exist in DNS. The publisher's API design
        is documented and was reachable to the issue contributor, so
        this is an access condition on the discovery network (Ukrainian
        government sites geo-block aggressively since 2022), not a dead
        dataset. Unblocks: national-accounts national line, CPI direct,
        LFS unemployment, population, births/deaths, causes of death,
        migration flows, household-survey poverty. The retry is one
        fetch from an unblocked network; the SDG portal
        (sdg.stat.gov.ua + uaukrstat.github.io CSVs) and the
        data.gov.ua SSSU mirror (388 datasets) answer today.
    - name: Open Budget portal API (state/local/consolidated budget execution)
      publisher: Open Budget (Ministry of Finance / openbudget.gov.ua)
      url: https://openbudget.gov.ua/en/about-portal
      official: true
      notes: >-
        INITIAL discovery-network attempt on 2026-10-24 received
        Akamai "Access Denied" (errors.edgesuite.net), including a
        browser user agent; the open-budget.gov.ua variant did not
        resolve. THIS ACCESS STATUS IS NETWORK-SPECIFIC, NOT A CLAIM
        THAT THE OFFICIAL PORTAL IS CURRENTLY UNAVAILABLE.
        The independent official December-2025 consolidated view at
        https://openbudget.gov.ua/?budgetType=CONSOLIDATED&month=12&year=2025
        was subsequently accessed and its ten functional categories
        preserved in fetch/reference_openbudget_2025.csv. Its total
        differs from the NBU cube's 2025 Total_1 by 6,920.18835381
        million UAH (the code-0400 economic-affairs difference explains
        most of it). Discrepancy may reflect a classification,
        retrospective revision or data-vintage mismatch; precise cause
        not verified. The portal licence was described as CC BY 4.0
        by the initial contributor's discovery. The NBU cube still
        provides independently reproducible Treasury cash records;
        no IMF general-government accrual slot has been filled.
    - name: Ministry of Finance site (mof.gov.ua) debt releases
      publisher: Ministry of Finance of Ukraine
      url: https://mof.gov.ua/en/derzhavnij-borg-ta-garantovanij-derzhavju-borg
      official: true
      notes: >-
        HTTP 403 on 2026-10-24. The same debt data are published by
        the Ministry itself on data.gov.ua (dataset
        4119d762-a5c1-4c4c-9c30-e2abdd383fb4, verified working), so
        only the press-release layer is pending.
    - name: State Customs Service statistics (customs.gov.ua)
      publisher: State Customs Service of Ukraine
      url: https://customs.gov.ua/statistika-ta-reiestri
      official: true
      notes: >-
        HTTP 403 on 2026-10-24; its data.gov.ua presence is registers
        and classifiers, not trade flows (organization listing
        verified). Goods trade by partner is covered by IMF IMTS
        (2018+) and UN Comtrade (2006+), both verified; the customs
        authority's own series would be the national line if the site
        becomes reachable.
    - name: Verkhovna Rada legislation portal (zakon.rada.gov.ua)
      publisher: Verkhovna Rada of Ukraine
      url: https://zakon.rada.gov.ua/laws/show/4695-20
      official: true
      notes: >-
        No connection at all on 2026-10-24 (curl exit before any HTTP
        status, both schemes, retries). The 2026 minimum wage
        (8,647 UAH/month, Law 4695-IX Article 8) is confirmed by
        convergent professional secondary sources; the law text is
        the primary and is verified when the portal answers.
    - name: Transparency International CPI workbook
      publisher: Transparency International
      url: https://images.transparencycdn.org/images/CPI2025-Results-and-trends.xlsx
      official: false
      notes: >-
        S3 AccessDenied (403) from the discovery network on
        2026-10-24 with both plain and browser UAs; Canada's lane
        fetched the identical URL successfully on 2026-10-22, so this
        is a network block, not a dead endpoint. Retry at fetch time.
    - name: UNHCR / IOM wartime displacement data APIs
      publisher: UNHCR; IOM Displacement Tracking Matrix
      url: https://data.unhcr.org/en/situations/ukraine
      official: false
      notes: >-
        The situation page answers 200 but the data endpoints are
        JS-assembled and the documented JSON paths redirect (verified
        2026-10-24). Lens-only content in any case; the canonical
        migration slots do not depend on it.
    - name: Ten-year government bond yield (markets slot 2)
      publisher: none verified
      url: ''
      official: true
      notes: >-
        Not an access failure — possibly nonexistent as a continuous
        official series: the NBU open-data API has no yield endpoint
        (verified against its 36-endpoint directory), Eurostat's
        irt_lt_mcby_a returns an empty UA slice (verified), and
        Ukraine's pre-2022 domestic bond market was thin and
        short-dated. Classification runs at fetch time: NBU
        yield-curve publications and MoF OVDP auction results are the
        remaining candidates; if none yields a defensible annual
        series, the slot is ctx.pending with exactly this note.
    - name: Ukrainian equity index (markets slot 4)
      publisher: redistributor for the PFTS / Ukrainian Exchange (UX) index
      url: ''
      official: false
      notes: >-
        Yahoo's ^PFTS is delisted (chart API: "No data found, symbol
        may be delisted", verified 2026-10-24). stooq/investing.com
        candidates were JS-walled in other lanes; the fetch swarm
        retries with a browser profile. Trading was suspended from
        24 Feb 2022 — any series carries that gap unsmoothed.
