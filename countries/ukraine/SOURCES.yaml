# Ukraine source manifest, Phase A research + reviewed historical sources.
# Accepted curated CSVs require exact publisher attribution; other entries
# under meta.pending remain research candidates, not chart-ready data.
meta:
  status: phase_a_seven_verified_national_series
  snapshot_date: '2026-10-24'
  upstream_issue: https://github.com/akitaonrails/worldreports/issues/1
  no_country_config_yet: true
  pending:
    - name: Real GDP growth 2006-2010/2025; nominal GDP 2006-2009/2025
      publisher: State Statistics Service of Ukraine
      url: https://stat.gov.ua/en/development-api
      notes: >-
        GDP growth 2011-2024 and nominal GDP 2010-2024 have been verified
        in separate dimension selections of one official SDMX dataflow.
        The current exact queries returned no GDP data for earlier years
        or 2025; do not splice other publishers or a press release.
        Other national-account series remain pending.
    - name: Consolidated/general-government fiscal series
      publisher: Ministry of Finance and appropriate harmonizing institution
      url: https://openbudget.gov.ua/en/about-portal
      notes: 'Cash budget and state-guaranteed debt are NOT canonical general-government accrual measurements.'
    - name: National household Gini and labour statistics
      publisher: State Statistics Service of Ukraine
      url: https://sdg.stat.gov.ua/uk/10-1-1/
      notes: 'Gini 2021=0.244 on a 0–1 scale; 2022–2025 explicitly missing; confirm survey and territorial scope.'
    - name: Customs partner/product breakdown and full 2006-2009 / 2025 national trade
      publisher: State Customs Service and State Statistics Service of Ukraine
      url: https://customs.gov.ua/statistika-ta-reiestri
      notes: >-
        The complete national-accounts goods-and-services exports/imports
        2010-2024 have been accepted below. Merchandise trade by destination
        and by product is a DIFFERENT customs basis and remains unverified;
        the exact national-accounts publisher selection has no earlier or 2025 rows.
    - name: Migration, mortality and security continuity
      publisher: State Statistics Service of Ukraine; administrative publishers
      url: https://stat.gov.ua/en/datasets
      notes: 'Verify population denominators and coverage; keep wartime humanitarian estimates distinct.'

markets:
  policy_rate.csv:
    source: National Bank of Ukraine — NBU key policy interest-rate archive, dated effective decisions
    url: https://bank.gov.ua/en/monetary/archive-rish
    refreshed_by: fetch/fetch_nbu_policy_rate.py
    notes: >-
      Official NBU monetary-policy decisions with each change's exact
      effective date. The curated policy_rate_eoy_pct is the rate legally
      in effect on each 31 December for 2006-2025, inclusive (20 calendar
      years). Reconstructed as the last published change effective on or
      before year-end, NOT the annual average, announcement-year rate,
      monetary aggregate or sovereign 10-year government bond yield.
      The 2011 archive lists no change, so its 31 December effective
      rate of 7.75 percent comes explicitly from the 2010-08-10
      decision; the source effective date is retained in the third
      CSV column, not guessed. Other anchors: 2006=8.50, 2015=22.00,
      2022=25.00, 2023=15.00, 2024=13.50, 2025=15.50 percent.
      Separate from the SSSU CPI series: CPI is the full-year
      average percentage inflation versus the prior year's average.
      Comparing the two on a panel is a labeled juxtaposition of
      DIFFERENT time aggregation, not a real-policy-rate calculation.
      The fetcher parses all NBU effective-date changes from the
      official history HTML, validates duplicates and reference years,
      then writes only policy_rate_from_nbu.csv review sidecar;
      never modifies the curated data automatically.
    compiled: Official historical monetary-policy decisions checked, 2026-10-24
  fx.csv:
    source: National Bank of Ukraine — official USD/UAH exchange rates (NBU_Exchange exchange_site)
    url: https://bank.gov.ua/en/open-data/api-dev
    refreshed_by: fetch/fetch_nbu_fx.py
    notes: >-
      Full annual calendar-year means of the official daily NBU exchange rate
      (UAH per ONE USD) from 2006 to 2025, inclusive. On 2026-10-24 each
      calendar year was fetched through the documented NBU_Exchange/exchange_site
      API; all 7,305 dates across 20 years were checked for uniqueness, complete
      year coverage, currency code USD/840, positive amounts, and consistency
      between quoted rate, units and rate_per_unit. Historical rows often quote
      USD in lots of 100 units: on 2006-01-01 the raw rate is 505 per 100 USD,
      normalized to 5.05 UAH/USD. Spot checks: 2014-01-01 = 7.993 UAH/USD;
      2022-01-04 = 27.2782 UAH/USD. Accepted 2006 mean = 5.05000000;
      2014 mean = 11.90953827; 2022 mean = 32.36835123;
      2025 mean = 41.69015205 UAH per USD. Annual means average every
      calendar day's published applicable official rate, including weekends,
      NOT the end-of-year close, a transaction-weighted rate or an interbank
      market quote. For the shared currency comparison slot, 2006=100 and
      a stronger hryvnia raises the index: 100*average_2006/average_year.
      The fetcher ONLY stages fx_from_nbu.csv for review and NEVER overwrites
      this curated snapshot. Publication and attribution: National Bank of Ukraine.
    compiled: direct API daily extraction and complete-year validation, 2026-10-24

macro:
  cpi.csv:
    source: State Statistics Service of Ukraine — national headline consumer price index, annual average versus previous year
    url: https://stat.gov.ua/sdmx/workspaces/default:integration/registry/sdmx/3.0/data/dataflow/SSSU/DF_PRICE_CHANGE_CONSUMER_GOODS_SERVICE/27.2.0/*
    refreshed_by: fetch/fetch_sssu_cpi.py
    notes: >-
      SSSU dataflow DF_PRICE_CHANGE_CONSUMER_GOODS_SERVICE(27.2.0),
      dimensions INDICATOR=INDEX_CONSUMPRICE, BASE_PERIOD=PREV_YEAR,
      REGION=UA00000000000000000, GOODS_SERVICES_TYPE=0, FREQ=A.
      The price index is a base-100 average of the calendar year's prices
      against the average of the preceding year; annual_inflation_pct =
      cpi_index_prev_year - 100. It is NOT December-to-December inflation,
      a month-over-month index, or an observation for the running year.
      All 20 calendar years 2006-2025 were retrieved directly via the
      official SDMX-CSV v2 endpoint on 2026-10-24. Units=1010, SCALE=0;
      OBS_FLAG is blank in every accepted row. Anchors: 2008=125.2 (25.2%),
      2015=148.7 (48.7%), 2022=120.2 (20.2%), 2024=106.5 (6.5%),
      2025=112.7 (12.7%). The full API stream includes older 2002-2005
      data but this snapshot follows the atlas's common year window. The
      publisher identifies territorial coverage breaks: 2014-2021 excluded
      Crimea, Sevastopol and parts of occupied Donetsk/Luhansk; from 2022
      onward, occupied territory and some hostilities-affected regions
      were also excluded from statistical coverage. These measurement
      exclusions must be annotated; this does not change Ukraine's legal
      territory. Refresh only writes cpi_from_sssu.csv for human review;
      never overwrite this curated CSV automatically.
    compiled: official annual CPI SDMX-CSV extraction, verified 2026-10-24
  gdp_nominal.csv:
    source: State Statistics Service of Ukraine — Annual national accounts, GDP at current prices (UAH million)
    url: https://stat.gov.ua/sdmx/workspaces/default:integration/registry/sdmx/3.0/data/dataflow/SSSU/DF_ANNUAL_NATIONAL_ACCOUNTS/7.0.0/*
    refreshed_by: fetch/fetch_sssu_gdp_nominal.py
    notes: >-
      SSSU:DF_ANNUAL_NATIONAL_ACCOUNTS(7.0.0), index INDICATOR=GDP_CUR_PRC,
      PRICE_TYPE=CURR_PRICES, REGION=UA00000000000000000,
      BREAKDOWN_CATEGORY=_T, BREAKDOWN=_T, SECTOR_ECONOMY=S_1, FREQ=A.
      The observed national-currency unit is UNITS_OF_MEASURE=1090,
      SCALE=6; OBS_VALUE is a nominal UAH level in millions, NOT real GDP
      growth and not billions. The exact SDMX-CSV v2 response contained
      fifteen annual observations, 2010-2024; source anchors in UAH million:
      2010=1079346, 2022=5239114, 2024=7662376. The 2024 value is also
      printed in the publisher's public indicator bulletin. No 2006-2009
      or 2025 figures were returned in this precise selection; do not
      silently substitute another revision. Territorial coverage is not
      stable; the publisher's attached notes exclude Crimea/Sevastopol
      in 2010-2021, parts of Donetsk and Luhansk for 2014-2021,
      and occupied or some hostilities-affected territories in 2022-2024.
      The source's index and volume definitions remain separate CSVs.
      A refresh writes gdp_nominal_from_sssu.csv as a review-only sidecar;
      curated data may change only after inspecting differences.
    compiled: direct source-filtered SSSU SDMX-CSV, 2026-10-24
  gdp_growth.csv:
    source: State Statistics Service of Ukraine — Annual national accounts, real GDP volume index versus previous year
    url: https://stat.gov.ua/sdmx/workspaces/default:integration/registry/sdmx/3.0/data/dataflow/SSSU/DF_ANNUAL_NATIONAL_ACCOUNTS/7.0.0/*
    refreshed_by: fetch/fetch_sssu_gdp.py
    notes: >-
      Source dataflow SSSU:DF_ANNUAL_NATIONAL_ACCOUNTS(7.0.0);
      exact dimension key INDICATOR=GDP_CUR_PRC, PRICE_TYPE=IDX_VOL_PY,
      REGION=UA00000000000000000 (publisher's Ukraine aggregate),
      BREAKDOWN_CATEGORY=_T, BREAKDOWN=_T, SECTOR_ECONOMY=S_1,
      FREQ=A. The observed unit code is UNITS_OF_MEASURE=1010, SCALE=0;
      OBS_VALUE is the real GDP volume index versus previous year.
      Annual real_growth = volume_index_py - 100, in percentage points,
      at the publisher's one-decimal precision. On 2026-10-24, the exact
      SDMX-CSV v2 response provided 14 annual observations for 2011-2024,
      inclusive. Reference years 2022=71.2 (-28.8 percent growth),
      2023=105.5 (+5.5 percent), and 2024=103.2 (+3.2 percent),
      matching the official GDP release. The dataflow availability
      metadata described a 2011-2025 window but the exact query returned
      NO 2025 observation. The 2025 figure published in another release
      is intentionally not spliced into this snapshot. No 2006-2010
      observations were returned. The publisher notes that its coverage
      for 2010-2021 excludes occupied Crimea and Sevastopol, for
      2014-2021 also excludes parts of Donetsk and Luhansk, and for
      2022-2024 excludes occupied or certain hostilities-affected areas.
      These are measurement scope breaks; see DATA_NOTES.md. This
      series is not comparable on an unchanged territorial denominator.
      The fetcher writes review sidecar gdp_growth_from_sssu.csv
      and NEVER overwrites this curated dataset.
    compiled: exact SSSU SDMX-CSV extraction, 2026-10-24

trade:
  trade_na.csv:
    source: State Statistics Service of Ukraine — national-accounts exports and imports of goods AND services
    url: https://stat.gov.ua/sdmx/workspaces/default:integration/registry/sdmx/3.0/data/dataflow/SSSU/DF_ANNUAL_NATIONAL_ACCOUNTS/7.0.0/*
    refreshed_by: fetch/fetch_sssu_macro_ratios.py
    notes: >-
      Two distinct components in SSSU:DF_ANNUAL_NATIONAL_ACCOUNTS(7.0.0),
      INDICATOR=EXPORT_GOODS_SERV and IMPORT_GOODS_SERV; both
      PRICE_TYPE=CURR_PRICES, REGION=UA00000000000000000,
      BREAKDOWN_CATEGORY=_T, BREAKDOWN=_T, SECTOR_ECONOMY=S_1, FREQ=A.
      Units=1090 and SCALE=6 mean millions of current UAH. The source
      names imports as a subtraction in the expenditure identity but its
      OBS_VALUE is a POSITIVE import magnitude, so balance=exports-imports.
      Ratios are each current-price national-accounts value divided by
      the same-vintage GDP from macro/gdp_nominal.csv times 100, stored
      to 4 decimal places. Coverage 2010-2024 inclusive; 2025 is not in
      the exact response. Reference 2024 nominal UAH million: exports
      2273580, imports 3832450, GDP 7662376; hence balance -20.3445
      percent of GDP. 2023 balance was -20.9087 percent; 2022 -16.5063.
      All three are beyond the shared trade.balance scale lower limit
      -15 percent in core/spine.py: a single atlas-wide scale decision
      and peer redraw is necessary, never clip the Ukrainian figures.
      The values are not merchandise-only customs statistics, nor the
      balance of payments. Publisher footnotes record territorial
      omissions during occupation and hostilities in 2014-2024.
      Fetcher stages trade_na_from_sssu.csv without updating this
      curated CSV automatically.
    compiled: SSSU annual current-price source components and pinned GDP, 2026-10-24

spending:
  investment.csv:
    source: State Statistics Service of Ukraine — whole-economy gross fixed capital formation
    url: https://stat.gov.ua/sdmx/workspaces/default:integration/registry/sdmx/3.0/data/dataflow/SSSU/DF_ANNUAL_NATIONAL_ACCOUNTS/7.0.0/*
    refreshed_by: fetch/fetch_sssu_macro_ratios.py
    notes: >-
      SSSU:DF_ANNUAL_NATIONAL_ACCOUNTS(7.0.0) with
      INDICATOR=GRS_FIX_CAP_FOR, PRICE_TYPE=CURR_PRICES,
      REGION=UA00000000000000000, BREAKDOWN_CATEGORY=_T,
      BREAKDOWN=_T, SECTOR_ECONOMY=S_1, FREQ=A, Units=1090,
      SCALE=6 (million UAH). The total-economy GFCF is NOT the
      general government's investment: do not use it in that panel.
      Coverage 2010-2024 inclusive, identical source vintage and
      geography as nominal GDP denominator. 2024 whole-economy GFCF
      1414286 million UAH / GDP 7662376 million = 18.4575% of GDP.
      Missing years, including 2025, are not extrapolated or zero-filled.
      Territorial data-collection changes are documented in DATA_NOTES.md.
      Fetcher writes investment_from_sssu.csv for manual review only.
    compiled: SSSU annual national accounts, 2026-10-24
