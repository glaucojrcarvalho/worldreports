    ro: "Economie, finanțe publice, populație și migrație din surse identificate; diferențele de teritoriu și de metodologie rămân vizibile, fără serii completate artificial."
    en: "Moldova's economy, public finances, population and migration from identified sources, keeping territorial and methodological breaks visible rather than silently filling missing data."
    pt: "Economia, finanças públicas, população e migração da Moldávia com fontes identificadas e diferenças territoriais e metodológicas explícitas, sem preenchimento artificial."
