  faint: "#8D9CA6"
  paper: "#FAFAF7"
  card: "#FFFFFF"
  grid: "#E1E6E8"
  spine: "#C7D0D5"
  band: "#F1F3F1"
  series: ["#18456D", "#B58B28", "#A64048", "#2E7867", "#247B81", "#72558E", "#1E2730"]
  # Moldova's blue-yellow-red tricolour is subdued for ink-on-paper.
  flag_bands: ["#255B94", "#D3AC40", "#A64048"]
