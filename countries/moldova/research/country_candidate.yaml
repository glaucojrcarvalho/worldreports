# CANDIDATE country configuration for Phase B/C; NOT ACTIVE IN ATLAS.
# Intentionally under research/, not countries/moldova/country.yaml.
# Romanian number style ("ro") and MDL affixes now exist in shared core.
# The country still lacks plates/chapters/full i18n/site assets; it is NOT
# a published atlas edition and must not be registered prematurely.
# Do not move this file into the country root until full integration gates pass.
slug: moldova
flag_emoji: "🇲🇩"
wordmark: Moldova
name:
  ro: "Republica Moldova"
  en: "Moldova"
  fr: "Moldavie"
  pt: "Moldávia"
  es: "Moldavia"
  ko: "몰도바"
  it: "Moldavia"
  he: "מולדובה"
  ja: "モルドバ"
  zh-Hans: "摩尔多瓦"
  zh-Hant: "摩爾多瓦"
  vi: "Moldova"
  de: "Moldau"
  uk: "Молдова"
  pl: "Mołdawia"
  ru: "Молдова"

locales:
  - {code: ro, html_lang: ro-MD, og_locale: ro_MD, endonym: "Română"}
  - {code: en, html_lang: en,    og_locale: en_US, endonym: "English"}
  - {code: pt, html_lang: pt-BR, og_locale: pt_BR, endonym: "Português"}
default_locale: ro
number_style: {ro: ro}
years: {from: 2006, to: 2026}
last_full_year: 2025
tick_every: 2
spine: true

# Do not invent quarter-level recessions from annual national GDP.
# Recession band dating requires a verified compatible quarterly series.
bands: []

currency: {code: MDL}
