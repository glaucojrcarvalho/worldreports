# Moldova — reviewed international comparable series, research Phase A.
# Cross-country layer is NOT a substitute for data from Moldova's own agencies.
# API source: World Bank World Development Indicators, sourceid=2;
# live payloads inspected 2026-10-26, lastupdated=2026-10-08.
#
# Each CSV below is the reviewed 2006–2025 API snapshot, with blank cells
# for unavailable years. fetch/fetch_wdi.py regenerates only *_from_wb.csv
# sidecars, never overwriting these committed CSVs.
#
# No country.yaml/plates.py exists yet: Moldova is not a published atlas.
# Every displayed series must be checked against its relevant NATIONAL
# publisher and precise territorial definition before rendering.
fiscal:
  public_budget.csv:
    source: "National Bureau of Statistics of Moldova (BNS) / Ministry of Finance, FIN010100, national public budget execution"
    url: "https://statbank.statistica.md/PxWeb/api/v1/en/40%20Statistica%20economica/25%20FIN/FIN010100.px"
    official: true
    refreshed_by: fetch/fetch_bns_budget.py
    notes: >-
      VERIFIED LIVE 2026-10-26 from the publisher's official PxWeb JSON-stat2
      data API (GitHub Actions run 40267150660): January-December full-year,
      million nominal MDL, 2016-2025. Revenue (code 0), expenditure plus
      nonfinancial assets (19), balance (30), ten spending functions (20-29).
      Fiscal identity and ALL TEN function totals reconcile exactly at
      published one-decimal precision. Caution: current live API's 2024
      expenditure 122962.7 and balance -12624.2 differ by 0.1 million MDL
      from BNS Finance overview's FINAL 2024 122962.6/-12624.1.
      The overview's edition is preserved separately in budget_summary.csv,
      not erased or silently spliced. 2025 139856.4/-14254.4 is PRELIMINARY.
      Cash-execution national public budget; table explicitly excludes
      left-bank Nistru districts and Bender. Not IMF WEO general-government
      accrual accounts. A review-only refresh writes *_from_bns.csv sidecars.
  budget_summary.csv:
    source: "National Bureau of Statistics of Moldova (BNS), Ministry of Finance national public budget execution"
    url: "https://statistica.gov.md/en/statistic_indicator_details/21"
    official: true
    refreshed_by: fetch/fetch_bns_budget.py
    notes: >-
      PUBLISHER-CHECKED SNAPSHOT, BNS website updated 2026-08-28:
      2024 FINAL and 2025 PRELIMINARY only, amounts in million nominal MDL.
      Revenue 110338.5/125602.0, expenditure and non-financial assets
      122962.6/139856.4, deficits -12624.1/-14254.4 respectively.
      National public budget, cash execution. Excludes left-bank Nistru
      districts and Bender (official FIN010100 table note).
      NOT a harmonised IMF general-government fiscal balance.
      The refresh script fetches 2016-2025 full-year categories into
      fiscal/budget_summary_from_bns.csv and a separate full
      functional report sidecar; it NEVER silently replaces these
      released outturns or the 2025 preliminary marker.
macro:
  economy.csv:
    source: "World Bank WDI (source 2), NY.GDP.MKTP.KD.ZG, FP.CPI.TOTL.ZG, SL.UEM.TOTL.ZS, NE.GDI.FTOT.ZS"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/NY.GDP.MKTP.KD.ZG?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      World Bank comparable: GDP growth, CPI inflation, ILO-modelled
      unemployment and gross fixed capital formation as share of GDP.
      Not the same perimeter/vintage as Moldova's BNS national indicators.
      BNS's 2025 real-growth release rounds 2.416497% to 2.4%.
world:
  world.csv:
    source: "World Bank WDI, NY.GDP.MKTP.CD, NY.GDP.PCAP.CD, FI.RES.TOTL.CD"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/NY.GDP.MKTP.CD?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Current US$ GDP, GDP per person, total reserves including gold, current US$.
      WB GDP in dollars is not BNS current-price GDP in MDL.
people:
  gini.csv:
    source: "World Bank WDI, SI.POV.GINI (harmonised household-survey Gini)"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/SI.POV.GINI?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      World Bank survey-based inequality series. 2025 unavailable in
      the 2026-10-08 WDI release and must stay blank.
trade:
  trade.csv:
    source: "World Bank WDI, NE.EXP.GNFS.ZS and NE.IMP.GNFS.ZS"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/NE.EXP.GNFS.ZS?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      National-accounts exports/imports of GOODS AND SERVICES as % of GDP.
      Not comparable to BNS merchandise-only customs trade by partner.
demography:
  demography.csv:
    source: "World Bank WDI/UN population, SP.POP.TOTL, SP.DYN.TFRT.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/SP.POP.TOTL?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      WB mid-year population and harmonised births/deaths/fertility.
      Scope reconciliation is MANDATORY: the BNS 2024 census counts
      2,409,207 usual residents on 2024-04-08 but omits 157 localities
      not under de facto constitutional control. WB 2024 mid-year
      population is 2,402,306, and it is not a census count.
      Do not splice those populations or derive migration from the difference.
mortality:
  mortality.csv:
    source: "World Bank WDI/UN population, SP.DYN.CDRT.IN and SP.DYN.LE00.IN"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/SP.DYN.CDRT.IN?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Crude death rate per 1,000 people and life expectancy at birth.
      As of WDI lastupdated 2026-10-08, both stop in 2024.
      BNS national registered deaths are a separate perimeter/source.
security:
  security.csv:
    source: "World Bank WDI via UNODC and WHO, VC.IHR.PSRC.P5, SH.STA.SUIC.P5, SH.STA.TRAF.P5"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/VC.IHR.PSRC.P5?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Rates per 100,000: homicides stop in 2023, suicide in 2021,
      road deaths in 2019. Missing annual records stay blank.
      Verify each numerator/denominator against national and WHO/UNODC
      territorial and definition metadata before any official plate.
migration:
  migration.csv:
    source: "World Bank WDI/UN, SM.POP.NETM (annual modeled net migration), SM.POP.TOTL (international migrant stock)"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/SM.POP.NETM?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Annual UN-modelled net migration is not a measured BNS registry
      immigration minus emigration flow. International migrant stock
      is only published for 2010, 2015, 2020 and 2024: snapshots, not
      intervening annual values. Do not extrapolate/interpolate.
meta:
  phase: A
  status: research_only_not_an_atlas_edition
  last_checked: "2026-10-26"
  wdi_vintage: "2026-10-08"
  verified:
    - name: "BNS Statbank FIN010100 cash budget 2016–2025"
      publisher: "National Bureau of Statistics of Moldova / Ministry of Finance"
      url: "https://statbank.statistica.md/PxWeb/api/v1/en/40%20Statistica%20economica/25%20FIN/FIN010100.px"
      official: true
      reviewed_utc: "2026-10-26"
      evidence: "https://github.com/glaucojrcarvalho/worldreports/actions/runs/40267150660"
      notes: >-
        Verified real POST JSON-stat2 response using national budget full-year
        January-December, million MDL 2016-2025: 10 rows, 13 indicator
        values per year, all accounting identities and ten-category spending
        sums reconciled to source precision. See fiscal/public_budget.csv and
        DATA_NOTES.md for both the 2024 API-vs-BNS-overview 0.1 million
        difference and the independent 2025 SDDS 0.8 million difference.
        Source year 2025 remains preliminary; no model interpolation.
  pending:
    - name: "National bank exchange rates, monetary and credit series"
      publisher: "National Bank of Moldova"
      url: "https://www.bnm.md/bdi/pages/reports/dovre/DOVRE8.xhtml?lang=en"
      notes: "Generator confirmed, exported time-series request parameters pending."
    - name: "IMF general-government fiscal comparable"
      publisher: "IMF World Economic Outlook, October 2026 vintage"
      url: "https://data.imf.org/datasets/WEO"
      notes: "Do not substitute national public budget cash balance for general-government IMF balance."
    - name: "BNS resident population and territorial concordance"
      publisher: "National Bureau of Statistics"
      url: "https://statistica.gov.md/en/final-results-of-the-2024-population-and-housing-census-geographical-distributio-10121_61877.html"
      notes: "Census on 2024-04-08 excludes 157 localities; check each national statistical-series perimeter."
