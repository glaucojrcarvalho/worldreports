# Moldova — reviewed international comparable series, research Phase A.
# Cross-country layer is NOT a substitute for data from Moldova's own agencies.
# API source: World Bank World Development Indicators, sourceid=2;
# live payloads inspected 2026-10-26, lastupdated=2026-10-08.
#
# Each CSV below is the reviewed 2006–2025 API snapshot, with blank cells
# for unavailable years. fetch/fetch_wdi.py regenerates only *_from_wb.csv
# sidecars, never overwriting these committed CSVs.
#
# Draft plates are present; country.yaml remains unregistered pending full QA.
# Every displayed series must be checked against its relevant NATIONAL
# publisher and precise territorial definition before rendering.
fiscal:
  weo_bal_debt.csv:
    source: "International Monetary Fund (IMF), World Economic Outlook (WEO), October 2026"
    url: "https://www.imf.org/external/datamapper/api/v2/GGXCNL_NGDP/MDA"
    official: true
    refreshed_by: fetch/fetch_imf.py
    notes: >-
      WEO OCTOBER 2026 edition verified 2026-10-26 using DataMapper v2
      metadata, source WEO, projection-year 2026, country MDA, annual % GDP.
      General-government net lending/borrowing (GGXCNL_NGDP) and gross debt
      (GGXWDG_NGDP): 2006-2025 in historical-estimate columns; 2026 only in
      *_proj. 2025 is NOT asserted to be an audited final national outturn.
      Publisher directly verified both 2024 -4.0% balance and 38.8% debt,
      2025 -3.9% balance and 39.2% debt (Oct-2026 WEO VINTAGE).
      Do not combine with BNS cash national budget, or with the December 2025
      FPP revenue/expense series as if they were a common WEO vintage.
      Source-audit evidence https://github.com/glaucojrcarvalho/worldreports/actions/runs/40269456831
  fpp_finances.csv:
    source: "International Monetary Fund (IMF), Public Finances in Modern History (FPP), December 2025"
    url: "https://www.imf.org/external/datamapper/api/v2/rev/MDA"
    official: true
    refreshed_by: fetch/fetch_imf.py
    notes: >-
      IMF DataMapper v2 explicitly labels rev, exp, pb, ie as FPP (Dec 2025),
      NOT WEO; source-metadata checked live 2026-10-26. Four measures (% GDP):
      revenue, spending, primary fiscal balance and interest expense
      from 2006-2024 ONLY. NO observations for 2025 and no 2026 projections.
      The FPP rev minus exp balance matches (primary balance minus interest)
      within 0.1 percentage point every year; no interpolation.
      This historical FPP estimate is its OWN dataset/vintage, not a
      WEO October 2026 six-column general-government table, even when
      source institutions and fiscal terms sound similar. Comparison charts
      must visibly label the distinct methodology, scope and release.
      Source-audit evidence https://github.com/glaucojrcarvalho/worldreports/actions/runs/40269456831
  public_budget.csv:
    source: "National Bureau of Statistics of Moldova (BNS) / Ministry of Finance, FIN010100, national public budget execution"
    url: "https://statbank.statistica.md/PxWeb/api/v1/en/40%20Statistica%20economica/25%20FIN/FIN010100.px"
    official: true
    refreshed_by: fetch/fetch_bns_budget.py
    notes: >-
      VERIFIED LIVE 2026-10-26 from the publisher's official PxWeb JSON-stat2
      data API (GitHub Actions run 40267150660): January-December full-year,
      million nominal MDL, 2016-2025. Revenue (code 0), expenditure plus
      nonfinancial assets (19), balance (30), ten spending functions (20-29).
      Fiscal identity and ALL TEN function totals reconcile exactly at
      published one-decimal precision. Caution: current live API's 2024
      expenditure 122962.7 and balance -12624.2 differ by 0.1 million MDL
      from BNS Finance overview's FINAL 2024 122962.6/-12624.1.
      The overview's edition is preserved separately in budget_summary.csv,
      not erased or silently spliced. 2025 139856.4/-14254.4 is PRELIMINARY.
      Cash-execution national public budget; table explicitly excludes
      left-bank Nistru districts and Bender. Not IMF WEO general-government
      accrual accounts. A review-only refresh writes *_from_bns.csv sidecars.
  budget_summary.csv:
    source: "National Bureau of Statistics of Moldova (BNS), Ministry of Finance national public budget execution"
    url: "https://statistica.gov.md/en/statistic_indicator_details/21"
    official: true
    refreshed_by: fetch/fetch_bns_budget.py
    notes: >-
      PUBLISHER-CHECKED SNAPSHOT, BNS website updated 2026-08-28:
      2024 FINAL and 2025 PRELIMINARY only, amounts in million nominal MDL.
      Revenue 110338.5/125602.0, expenditure and non-financial assets
      122962.6/139856.4, deficits -12624.1/-14254.4 respectively.
      National public budget, cash execution. Excludes left-bank Nistru
      districts and Bender (official FIN010100 table note).
      NOT a harmonised IMF general-government fiscal balance.
      The refresh script fetches 2016-2025 full-year categories into
      fiscal/budget_summary_from_bns.csv and a separate full
      functional report sidecar; it NEVER silently replaces these
      released outturns or the 2025 preliminary marker.
markets:
  policy.csv:
    source: "National Bank of Moldova (NBM), official base rate decisions effective dates"
    url: "https://www.bnm.md/en/export-base-rates?limit=1000"
    official: true
    refreshed_by: fetch/fetch_nbm.py
    notes: >-
      LIVE OFFICIAL NBM CSV verified 2026-10-26 (GitHub Actions run
      40273821580), 106 effective-dated decisions from 2001-02-01 through
      2026-09-17. Complete 2006-2025 historical annual series.
      policy_mean_pct is a DERIVED, calendar-day-weighted mean of the
      rate in force each day; policy_dec31_pct is the setting in force
      on December 31 and is NOT that annual mean.
      No 2026 incomplete-year flow is staged. Publisher's semicolon
      delimiter/comma-decimal and signed BNM footer are validated.
      2024 mean 3.810519% and end 3.60%; 2025 mean 6.134247%
      and end 5.00%. Fetcher writes review-only *_from_nbm.csv.
  usd_mdl.csv:
    source: "National Bank of Moldova (NBM), official average exchange rate USD against MDL"
    url: "https://www.bnm.md/en/export-average-rates?date_from=01.01.2025&date_to=31.12.2025"
    official: true
    refreshed_by: fetch/fetch_nbm.py
    notes: >-
      LIVE OFFICIAL NBM CSV verified 2026-10-26 (GitHub Actions run
      40273821580), 20 independent published Jan1-Dec31 annual average
      quotes for years 2006-2025. mdl_per_usd_annual_avg means LEI
      PER ONE USD; publisher's nominal Rate divisor is explicitly
      applied to quoted Rates. Do not invert this into USD/MDL or use
      spot quotations. 2024 17.7918 MDL/USD; 2025 17.3705 MDL/USD.
      The source links use 2025 as an example; fetcher requests every
      completed annual window separately and writes review-only sidecars.
macro:
  economy.csv:
    source: "World Bank WDI (source 2), NY.GDP.MKTP.KD.ZG, FP.CPI.TOTL.ZG, SL.UEM.TOTL.ZS, NE.GDI.FTOT.ZS"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/NY.GDP.MKTP.KD.ZG?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      World Bank comparable: GDP growth, CPI inflation, ILO-modelled
      unemployment and gross fixed capital formation as share of GDP.
      Not the same perimeter/vintage as Moldova's BNS national indicators.
      BNS's 2025 real-growth release rounds 2.416497% to 2.4%.
credit:
  private_credit.csv:
    source: "World Bank WDI (source 2), FS.AST.PRVT.GD.ZS, domestic private-sector credit (% of GDP)"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/FS.AST.PRVT.GD.ZS?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Primary World Bank WDI API sourceid=2 MDA checked on 2026-10-27;
      lastupdated=2026-10-08, independently archived in source CI
      https://github.com/glaucojrcarvalho/worldreports/actions/runs/40428253945.
      Observations 2010-2025; 2006-2009 missing, not zero.
      This includes total private-sector claims by financial corporations,
      NOT household-only debt. Some public enterprises may be included.
      Only chart in credit.lens; it does not measure household debt.
      The NBM bank-wide prudential NPL series uses a DIFFERENT denominator
      and is not a household-only non-performing loan indicator.
  prudential_npl.csv:
    source: "National Bank of Moldova (NBM), official banking-sector year-end prudential NPL reports"
    url: "https://bnm.md/en/content/financial-situation-banking-sector-year-2022"
    official: true
    refreshed_by: fetch/fetch_nbm_npl.py
    notes: >-
      Original NBM bank-wide December 31 non-performing loans as a share of
      ALL bank prudential gross loans: 2022=6.4%, 2023=5.6%, 2024=4.1%,
      2025=4.1%. Substandard, doubtful and compromised loans, NOT borrower-
      defined household-only NPL, not IFRS impairment or overdue loans.
      Individual 2023 report https://bnm.md/ru/node/66762 ;
      2024 report https://bnm.md/en/content/financial-situation-banking-sector-2024 ;
      2025 report https://bnm.md/ro/node/69800 .
      2024 text reports 1.4 pp improvement vs 2023, but subtraction of
      separately published rounded 2023=5.6 and 2024=4.1 gives 1.5 pp.
      Do NOT invent a revised rate or assert a methodology break;
      preserve separate unconnected publisher-publication segments.
      2006-2021 and incomplete 2026 are blank; no annual averaging.
      Territorial scope not asserted equal to BNS resident statistics.
world:
  cpi.csv:
    source: "Transparency International, Corruption Perceptions Index 2025, official score timeseries since 2012"
    url: "https://images.transparencycdn.org/images/CPI2025_Results.xlsx"
    official: true
    refreshed_by: fetch/fetch_ti.py
    notes: >-
      Original CPI 2025 official XLSX workbook was audited in read-only
      Actions run 40440734736 on 2026-10-27, original source SHA256
      543a2ad438c4ba9a70367ee10a44a2565de7fae6bcd8a8db0c23d0b993e46e31. Fourteen annual values 2012-2025;
      no 2006-2011 scores after the 2012 methodological revision.
      Anchors 2012=36, 2023=42, 2024=43, 2025=42.
      Expert/business PERCEPTIONS of public-sector corruption (0-100,
      higher is cleaner), not observed crimes or regional prevalence.
      Different territorial scope from national BNS cash accounts may apply.
      Publisher credit/licence: Transparency International, CC BY-ND 4.0.
      Method: https://www.transparency.org/en/news/how-cpi-scores-are-calculated
  hdi.csv:
    source: "United Nations Development Programme (UNDP), Human Development Report 2025, complete composite indices time series"
    url: "https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv"
    official: true
    refreshed_by: fetch/fetch_undp.py
    notes: >-
      Reviewed directly against the FULL official HDR 2025 historical CSV
      (UNDP country code MDA, original publisher bytes SHA256
      61ed82e5b66c88dfca8ff9fac775c63981ecab6a254862af97acacc41c143117).
      Eighteen historical observations, 2006-2023; 2024 and 2025 are BLANK,
      not estimates or interpolations. The 2025 edition revises earlier years;
      do not splice any value from an earlier HDR edition. The official
      full-series CSV reports 2022=0.784 and 2023=0.785. A separate UNDP
      Moldova press release dated 2025-05-06 instead reports 2022=0.763
      (2023=0.785); we privilege the pinned complete-data edition, disclose
      this 0.021 disagreement and do NOT claim a 0.022 improvement.
      Source audit (2026-10-27) https://github.com/glaucojrcarvalho/worldreports/actions/runs/40436229785
      UNDP index (0-1) is NOT World Bank GDP, BNS census population,
      inequality-adjusted HDI or a Transparency International CPI score.
      Verify historical territorial perimeter before deriving national comparisons.
  world.csv:
    source: "World Bank WDI, NY.GDP.MKTP.CD, NY.GDP.PCAP.CD, FI.RES.TOTL.CD"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/NY.GDP.MKTP.CD?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Current US$ GDP, GDP per person, total reserves including gold, current US$.
      WB GDP in dollars is not BNS current-price GDP in MDL.
people:
  absolute_poverty.csv:
    source: "National Bureau of Statistics of Moldova (BNS), absolute consumption poverty from Household Budget Survey"
    url: "https://statistica.gov.md/files/files/SDG/docs/Raport_ODD_%202024.pdf"
    official: true
    refreshed_by: "Manual primary publisher report transcription and edition audit, 2026-10-27"
    notes: >-
      National absolute CONSUMPTION poverty rate (% of people), not the
      World Bank international dollar poverty line, WDI Gini or experimental
      relative at-risk-of-poverty measure. BNS's 2024 national SDG progress
      report indicator 1.2.1 p.17 supplies annual 2014-2023 observations;
      its 2024 poverty report gives 33.6% and current 2025 BNS poverty
      indicator gives 31.1%. The 2019 Household Budget Survey methodology
      revision is preserved using distinct, unconnected pre_2019_pct
      (2014-2018) and post_2019_pct (2019-2025) series; 2006-2013 remain
      absent. Percentages use primary source 0.1 point precision; no
      interpolation or 2018-2019 comparable growth claim. National
      household survey coverage must not be assumed identical to
      internationally harmonised population or Gini series.
  minimum_wage.csv:
    source: "Government of the Republic of Moldova (statutory minimum wage); National Bank of Moldova (annual USD/MDL exchange rate)"
    url: "https://old.gov.md/ro/content/salariul-minim-pe-tara-va-fi-majorat-pana-la-4000-de-lei"
    official: true
    refreshed_by: "Audited Government decisions 2022-12-07, 2023-12-06 and 2024-12-18; NBM official FX from fetch/fetch_nbm.py"
    notes: >-
      Official GOVERNMENT full-time gross MONTHLY statutory national minimum,
      nominal MDL: 2023=4000, 2024=5000 and 2025=5500; effective January 1
      in each year (169 hours/month reference). Government reports:
      2023 https://old.gov.md/ro/content/salariul-minim-pe-tara-va-fi-majorat-pana-la-4000-de-lei
      2024 https://old.gov.md/ro/content/salariul-minim-pe-tara-anul-2024-va-constitui-5000-lei-mai-mare-cu-1000-de-lei-decat-2023
      2025 https://old.gov.md/ro/content/salariul-mediu-lunar-pe-economie-prognozat-pentru-anul-2025-va-constitui-16-100-de-lei
      Labor Ministry: countrywide pay unification took effect 2022-09-01;
      https://social.gov.md/comunicare/comunicate/din-1-septembrie-2022-salariul-minim-va-fi-unificat-in-toate-institutiile-din-tara/
      Therefore 2006-2022 are BLANK, not zero or backfilled by earlier
      public/private sector minima. USD/month = legal MDL/month divided by
      same-year official NBM calendar-year average MDL per 1 USD (usd_mdl.csv):
      2023=18.160700, 2024=17.791800, 2025=17.370500.
      This is a currency translation of a statutory floor, NOT actual earnings,
      median wages, inflation-adjusted purchasing power, or PPP.
      Government set 2026=6300 MDL, but full-calendar-year 2026 NBM FX
      is unavailable, so no 2026 annual USD point is drawn.
      Legal jurisdiction and sample-population perimeter must not be assumed
      identical to BNS poverty or WDI Gini.
  gini.csv:
    source: "World Bank WDI, SI.POV.GINI (harmonised household-survey Gini)"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/SI.POV.GINI?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      World Bank survey-based inequality series. 2025 unavailable in
      the 2026-10-08 WDI release and must stay blank.
trade:
  destinations.csv:
    source: "National Bureau of Statistics of Moldova (BNS), Statbank EXT010200, customs-goods exports by country and country group"
    url: "https://statbank.statistica.md/PxWeb/pxweb/en/40%20Statistica%20economica/40%20Statistica%20economica__21%20EXT__EXT010__serii%20anuale/EXT010200.px"
    official: true
    refreshed_by: fetch/fetch_bns_trade.py
    notes: >-
      Annual 2006-2025 percentages for the five largest INDIVIDUAL country
      destinations in 2025: Romania, Turkey, Italy, Czechia and Ukraine.
      Numerator: same-year named customs-country exports (thousand USD);
      denominator: SAME-year BNS all-partner goods-export Total (code 0).
      NOT WDI goods-and-services national-accounts percent GDP. Source JSON-stat2
      SHA256 5e1fc55f430c4e75a07c172b99a7b60501217fbfd6816e3dc5a5a32a97454fa4; metadata SHA256 1adfac120905d511a5246b524ed0a8c957e48da88fe9c9a41f4ee76a36d186e7.
      BNS partner codes 35, 86, 27, 17 and for Ukraine 11 (2006-2023),
      87 (2024-2025). Ukraine moves from the CIS group to the other-country
      group in 2024; country observations remain separate from groups.
      BNS excludes left-bank Nistru and Bender exporters.
      Current Statbank 2025 total: 3780863.9 thousand USD; BNS preliminary
      2025 goods-export release: 3782.7 million USD, a 0.049 percent vintage
      difference, not silently reconciled. No 2026 annual observations.
      Live official source review:
      https://github.com/glaucojrcarvalho/worldreports/actions/runs/40446267708
  trade.csv:
    source: "World Bank WDI, NE.EXP.GNFS.ZS and NE.IMP.GNFS.ZS"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/NE.EXP.GNFS.ZS?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      National-accounts exports/imports of GOODS AND SERVICES as % of GDP.
      Not comparable to BNS merchandise-only customs trade by partner.
demography:
  demography.csv:
    source: "World Bank WDI/UN population, SP.POP.TOTL, SP.DYN.TFRT.IN, SP.DYN.CBRT.IN, SP.DYN.CDRT.IN"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/SP.POP.TOTL?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      WB mid-year population and harmonised births/deaths/fertility.
      Scope reconciliation is MANDATORY: the BNS 2024 census counts
      2,409,207 usual residents on 2024-04-08 but omits 157 localities
      not under de facto constitutional control. WB 2024 mid-year
      population is 2,402,306, and it is not a census count.
      Do not splice those populations or derive migration from the difference.
mortality:
  mortality.csv:
    source: "World Bank WDI/UN population, SP.DYN.CDRT.IN and SP.DYN.LE00.IN"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/SP.DYN.CDRT.IN?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Crude death rate per 1,000 people and life expectancy at birth.
      WDI life expectancy is a PERIOD life-table estimate based on
      prevailing age-specific mortality, not an observed birth cohort's
      actual lifetime. Official methodology:
      https://databank.worldbank.org/metadataglossary/millennium-development-goals/series/SP.DYN.LE00.IN
      As of WDI lastupdated 2026-10-08, both stop in 2024.
      BNS national registered deaths are a separate perimeter/source.
security:
  security.csv:
    source: "World Bank WDI via UNODC and WHO, VC.IHR.PSRC.P5, SH.STA.SUIC.P5, SH.STA.TRAF.P5"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/VC.IHR.PSRC.P5?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Rates per 100,000: homicides stop in 2023, suicide in 2021,
      road deaths in 2019. Missing annual records stay blank.
      Verify each numerator/denominator against national and WHO/UNODC
      territorial and definition metadata before any official plate.
migration:
  migration.csv:
    source: "World Bank WDI/UN, SM.POP.NETM (annual modeled net migration), SM.POP.TOTL (international migrant stock)"
    url: "https://api.worldbank.org/v2/country/MDA/indicator/SM.POP.NETM?format=json"
    official: false
    refreshed_by: fetch/fetch_wdi.py
    notes: >-
      Annual UN-modelled net migration is not a measured BNS registry
      immigration minus emigration flow. International migrant stock
      is only published for 2010, 2015, 2020 and 2024: snapshots, not
      intervening annual values. Do not extrapolate/interpolate.
meta:
  phase: C
  status: research_only_not_an_atlas_edition
  last_checked: "2026-10-27"
  wdi_vintage: "2026-10-08"
  verified:
    - name: "WDI domestic private-sector credit 2010–2025"
      publisher: "World Bank World Development Indicators"
      official: false
      url: "https://api.worldbank.org/v2/country/MDA/indicator/FS.AST.PRVT.GD.ZS?format=json"
      reviewed_utc: "2026-10-27"
      evidence: "https://github.com/glaucojrcarvalho/worldreports/actions/runs/40428253945"
      notes: >-
        Sourceid=2, MDA, vintage 2026-10-08. 2010 29.497046%,
        2024 29.333210%, 2025 33.593935%; 2006-2009 blank.
        This is total private-sector credit, NOT household borrowing.
    - name: "Official NBM base rate and annual USD/MDL average, 2006–2025"
      publisher: "National Bank of Moldova"
      official: true
      reviewed_utc: "2026-10-26"
      evidence: "https://github.com/glaucojrcarvalho/worldreports/actions/runs/40273821580"
      notes: >-
        The official 106-decision base-rate CSV and all 20 official
        yearly USD average-rate CSVs were collected live. Two distinct
        time concepts are preserved: calendar-day-weighted base rate
        vs December 31 setting; FX quotes are per one USD after
        dividing publisher Rates by its nominal Rate quantity.
        No interpolated observations or incomplete 2026 annual totals.
    - name: "IMF WEO October 2026 balance/debt and FPP December 2025 revenue/expenditure"
      publisher: "International Monetary Fund"
      url: "https://www.imf.org/external/datamapper/api/v2/indicators"
      official: true
      reviewed_utc: "2026-10-26"
      evidence: "https://github.com/glaucojrcarvalho/worldreports/actions/runs/40269456831"
      notes: >-
        WEO and FPP verified as TWO DIFFERENT datasets by live publisher
        API metadata. 21 WEO rows (2006-2026 including separate 2026
        forecasts); 19 FPP rows (2006-2024). Both imported and separately
        attributed. Historical estimate does not mean audited national
        final; country MDA and percent GDP are asserted in fetcher.
    - name: "BNS Statbank FIN010100 cash budget 2016–2025"
      publisher: "National Bureau of Statistics of Moldova / Ministry of Finance"
      url: "https://statbank.statistica.md/PxWeb/api/v1/en/40%20Statistica%20economica/25%20FIN/FIN010100.px"
      official: true
      reviewed_utc: "2026-10-26"
      evidence: "https://github.com/glaucojrcarvalho/worldreports/actions/runs/40267150660"
      notes: >-
        Verified real POST JSON-stat2 response using national budget full-year
        January-December, million MDL 2016-2025: 10 rows, 13 indicator
        values per year, all accounting identities and ten-category spending
        sums reconciled to source precision. See fiscal/public_budget.csv and
        DATA_NOTES.md for both the 2024 API-vs-BNS-overview 0.1 million
        difference and the independent 2025 SDDS 0.8 million difference.
        Source year 2025 remains preliminary; no model interpolation.
  pending:
    - name: "NBM household credit, bank loan rates, non-performing ratio and sovereign yields"
      publisher: "National Bank of Moldova"
      url: "https://www.bnm.md/bdi/pages/reports/dpmc/DPMC10.xhtml?id=74410&lang=en"
      notes: >-
        The monetary policy rate and official USD/MDL exchange averages
        are now verified and curated separately under markets/. Credit
        stock by borrower, new-loan rate, nonperforming ratio and
        government bond yields still need compatible published definitions,
        machine-readable reports and a source audit. Do not label
        credit as complete merely because NBM market data are complete.
    - name: "Fully harmonised four-panel fiscal spine (revenue, spending, balance, debt, primary balance, interest)"
      publisher: "IMF WEO / FPP: non-identical releases"
      url: "https://data.imf.org/datasets/WEO"
      notes: >-
        WEO balance/debt and FPP revenue/spending/primary balance/interest
        have NOW been staged and attributed separately. What is STILL
        pending is a verified consistent single-vintage, single-methodology
        full four-panel fiscal presentation: FPP only goes to 2024 while
        WEO October 2026 has balance/debt through 2025 and a 2026 forecast.
        Never plot the FPP amounts as if they are WEO observations.
    - name: "BNS resident population and territorial concordance"
      publisher: "National Bureau of Statistics"
      url: "https://statistica.gov.md/en/final-results-of-the-2024-population-and-housing-census-geographical-distributio-10121_61877.html"
      notes: "Census on 2024-04-08 excludes 157 localities; check each national statistical-series perimeter."
